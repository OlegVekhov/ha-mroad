name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install aiohttp
      - run: python -m unittest discover -s tests -v
      - name: Validate tag and build archive
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json, os, pathlib, zipfile
          root = pathlib.Path('custom_components/mroad')
          version = json.loads((root / 'manifest.json').read_text())['version']
          assert os.environ['RELEASE_TAG'] == 'v' + version, 'Tag must match manifest version'
          with zipfile.ZipFile('mroad.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for path in root.rglob('*'):
                  if path.is_file() and '__pycache__' not in path.parts:
                      archive.write(path, path.relative_to(root))
          PY
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" mroad.zip --title "$RELEASE_TAG" --generate-notes
